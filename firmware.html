<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Firmware Library — Nezha Flasher</title>

    <meta
        name="description"
        content="Download firmware for ESP32 devices using Nezha Flasher."
    >

    <link rel="stylesheet" href="style.css">

</head>


<div class="cyber-particles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>


<body>

    <div class="background-grid"></div>


    <!-- NAVBAR -->

    <header class="navbar">

        <a href="index.html" class="brand">

            <div class="brand-icon">
                ⚡
            </div>

            <div>

                <h1>
                    NEZHA <span>FLASHER</span>
                </h1>

                <p>
                    ESP Firmware Utility
                </p>

            </div>

        </a>


        <nav class="nav-links">

            <a href="index.html">
                Flasher
            </a>

            <a
                href="firmware.html"
                class="active"
            >
                Firmware
            </a>

        </nav>


        <div class="version">
            v1.0.0
        </div>

    </header>


    <!-- MAIN -->

    <main class="firmware-container">


        <!-- HERO -->

        <section class="firmware-hero">

            <div class="status-badge">

                <span class="status-dot"></span>

                FIRMWARE LIBRARY

            </div>


            <h2>
                Download your
                <span>firmware.</span>
            </h2>


            <p>
                Browse and download official Nezha firmware
                for your ESP device.
            </p>

        </section>


        <!-- CONTROLS -->

        <section class="firmware-controls">

            <div class="search-box">

                <span>⌕</span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search firmware..."
                >

            </div>


            <div class="filter-buttons">

                <button
                    class="filter-btn active"
                    data-board="all"
                >
                    All
                </button>

                <button
                    class="filter-btn"
                    data-board="ESP32"
                >
                    ESP32
                </button>

                <button
                    class="filter-btn"
                    data-board="ESP32-S3"
                >
                    ESP32-S3
                </button>

                <button
                    class="filter-btn"
                    data-board="ESP32-C3"
                >
                    ESP32-C3
                </button>

                <button
                    class="filter-btn"
                    data-board="ESP8266"
                >
                    ESP8266
                </button>

            </div>

        </section>


        <!-- FIRMWARE GRID -->

        <section
            id="firmwareGrid"
            class="firmware-grid"
        >

            <!-- Cards generated by firmware.js -->

        </section>


        <!-- EMPTY STATE -->

        <div
            id="emptyState"
            class="empty-state hidden"
        >

            <div>
                🔍
            </div>

            <h3>
                No firmware found
            </h3>

            <p>
                Try another search or board type.
            </p>

        </div>


    </main>


    <!-- FOOTER -->

    <footer>

        <div>
            ⚡ <strong>Nezha Flasher</strong>
        </div>

        <div>
            Firmware Library
        </div>

    </footer>


    <script src="firmware.js"></script>

</body>

</html>
